name: Build desktop apps

on:
  push:
    tags: ['t3-v*']
  workflow_dispatch:
    inputs:
      only_latest:
        description: 'Skip the build; only refresh the t3-latest links from the current version'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.only_latest }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: t3-v__VERSION__
          releaseName: 'Taskal 3 v__VERSION__'
          releaseBody: |
            **Windows:** download `Taskal 3_..._x64-setup.exe` and run it. If Windows shows "Windows protected your PC", click **More info → Run anyway** (the app isn't signed with a paid certificate).
            **Mac:** download the `.dmg`, drag Taskal 3 to Applications, then right-click → Open the first time.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

  # Permanent links that always give the newest Taskal 3:
  # https://github.com/2mj4n5kh7c-beep/taskal/releases/download/t3-latest/Taskal-3-Windows.exe
  # https://github.com/2mj4n5kh7c-beep/taskal/releases/download/t3-latest/Taskal-3-Mac.dmg
  latest:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy this version's installers to the t3-latest release
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir dl && cd dl
          gh release download "t3-v$V" --pattern '*_x64-setup.exe' --pattern '*_universal.dmg'
          mv *_x64-setup.exe Taskal-3-Windows.exe
          mv *_universal.dmg Taskal-3-Mac.dmg
          gh release view t3-latest >/dev/null 2>&1 || gh release create t3-latest --prerelease --title "Taskal 3 (always the newest)" --notes "Permanent download links for the newest Taskal 3."
          gh release edit t3-latest --notes "Permanent download links for the newest Taskal 3. Currently: v$V."
          gh release upload t3-latest Taskal-3-Windows.exe Taskal-3-Mac.dmg --clobber
